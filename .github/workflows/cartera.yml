name: Aplicar cambios de Antonio
on:
  workflow_dispatch:
    inputs:
      publish_only:
        description: Publicar los datos ya verificados sin consultar federaciones
        required: false
        type: boolean
        default: false
      refresh_evidence:
        description: Releer una ficha incompleta y recalcular los parciales confirmados
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: agenda-production
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - id: check
        run: python scripts/registry_remote.py --check
  update:
    needs: check
    if: needs.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validar cambios de cartera
        if: inputs.publish_only != true
        run: python scripts/registry_remote.py --priority --watch-intake
      - name: Actualizar agenda
        if: inputs.publish_only != true
        continue-on-error: true
        run: python scripts/sync.py --intake --watch-intake
      - name: Actualizar sumas parciales confirmadas
        env:
          RFHF_REFRESH_EVIDENCE: ${{ inputs.refresh_evidence }}
        run: python scripts/improve_data.py
      - name: Guardar registro y datos publicados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/roster.json docs/data/feed.json docs/data/registry-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aplicar cambios guardados por Antonio'
            git fetch origin main
            git rebase origin/main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
