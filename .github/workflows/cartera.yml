name: Comprobar respuesta publica de BeSoccer
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Leer metadatos publicos sin ejecutar JavaScript
        run: |
          python -u - <<'PY'
          import json,re,urllib.request,http.cookiejar,time
          base='https://es.besoccer.com'
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          opener.addheaders=[('User-Agent','RFHF-Agenda/1.0 (public football fixtures; github.com/antonio8aranda98-lang/rfhf-agenda)'),('Accept','text/html')]
          paths=['/equipo/plantilla/ad-sporting-hortaleza-a-juvenil','/jugador/t-arzeno-3867422','/equipo/partidos/ad-sporting-hortaleza-a-juvenil']
          for path in paths:
            time.sleep(2)
            try:
              req=urllib.request.Request(base+path,headers={'Referer':base,'Accept':'text/html'})
              with opener.open(req,timeout=30) as r:
                html=r.read(8000000).decode('utf-8',errors='replace')
                title=re.search(r'<title[^>]*>(.*?)</title>',html,re.S|re.I)
                canonical=re.search(r'<link[^>]*canonical[^>]*>',html,re.I)
                print(json.dumps({'path':path,'status':r.status,'url':r.url,'bytes':len(html),'title':title[1] if title else None,'canonical':canonical[0] if canonical else None,'has_team':'SportsTeam' in html,'has_season':'id="season"' in html,'has_matches':'match-link' in html},ensure_ascii=False))
            except Exception as e:print(json.dumps({'path':path,'error':type(e).__name__,'message':str(e)[:150]}))
          PY
