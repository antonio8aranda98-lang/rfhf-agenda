name: Actualizar horarios de Valencia
on:
  workflow_dispatch:
  schedule:
    - cron: '8,38 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: agenda-production
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Reservar tiempo para publicar el avance
        run: echo "RFHF_WORK_DEADLINE=$(( $(date +%s) + 600 ))" >> "$GITHUB_ENV"
      - name: Consultar solo próximas jornadas FFCV
        run: python scripts/valencia_fixtures.py --watch-intake
      - name: Guardar horarios verificados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar horarios próximos de Valencia'
            git fetch origin main
            git rebase origin/main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
