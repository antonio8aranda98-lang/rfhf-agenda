name: Gestionar jugadores
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: agenda-production
  cancel-in-progress: false
jobs:
  manage:
    if: github.actor == github.repository_owner && github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[RFHF] ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      applied: ${{ steps.registry.outputs.applied }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Verificar gestión y reglas deportivas
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tests
      - name: Comprobar solicitud y modificar registro
        id: registry
        run: python scripts/registry.py
      - name: Actualizar y retirar jugadores inactivos
        if: steps.registry.outputs.applied == 'true'
        continue-on-error: true
        run: python scripts/sync.py
      - name: Guardar cartera y agenda
        if: steps.registry.outputs.applied == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/roster.json docs/data/feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aplicar gestión de jugadores verificada'
            git push
          fi
      - uses: actions/configure-pages@v5
        if: steps.registry.outputs.applied == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.registry.outputs.applied == 'true'
        with:
          path: docs
      - name: Informar de una solicitud pendiente
        if: steps.registry.outputs.applied != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('.cache/management-result.json', 'utf8'));
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number,
              body: '⏳ **Solicitud pendiente. No se ha cambiado la cartera.**\n\n' + result.message + '\n\nCorrige los datos de la solicitud o espera a que vuelva la fuente oficial y cierra/reabre esta incidencia para reintentar.'});
  deploy:
    needs: manage
    if: needs.manage.outputs.applied == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  confirm:
    needs: [manage, deploy]
    if: always() && needs.manage.outputs.applied == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const success = process.env.DEPLOY_RESULT === 'success';
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number,
              body: success ? '✅ Cartera actualizada y agenda publicada. [Abrir agenda](https://antonio8aranda98-lang.github.io/rfhf-agenda/).' : 'El registro se ha guardado, pero la publicación ha fallado. Revisa Actions y vuelve a ejecutar «Actualizar agenda y publicar».'});
            if (success) await github.rest.issues.update({...context.repo, issue_number: context.issue.number, state:'closed'});
